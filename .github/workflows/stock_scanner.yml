name: 台股盤後選股

on:
  schedule:
    # 週一到週五台北時間 18:00 推播。GitHub 常把排程延後數小時，
    # 若直接排 18:00，工作往往隔天凌晨才開始，當天收盤已經對不上。
    # 因此 12:45 先佔住執行環境，程式在裡面等到 18:00 再抓收盤、發 Telegram。
    # 12:45 台北 = 04:45 UTC。台灣沒有日光節約時間。
    - cron: "45 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # 12:45 啟動後要等到 18:00，再加上下載行情的時間，30 分鐘不夠。
    timeout-minutes: 360
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行選股
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SCAN_MODE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Taipei
        run: python main.py
